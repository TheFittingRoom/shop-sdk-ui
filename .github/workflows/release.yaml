name: Release

# Human-initiated release. Triggered manually from the Actions tab when
# you're ready to ship a new version. Replaces the previous label-driven
# auto-publish-on-PR-merge flow (which had a fragile multi-stage chain
# tied to PATs, `pull_request_target` quirks, and OIDC trigger
# restrictions).
#
# Flow, in one job: verify main (the same check + build + e2e steps as
# the verify job in pr-checks.yml) → bump on a fresh release-bump-<ts>
# branch → confirm the bump commit changes only the version, and rebuild
# → publish to npm via OIDC trusted publishing → push branch + tag →
# open PR to main → post a `verify` check run on the bump SHA → enable
# auto-merge. Any failure stops the run before anything is published,
# pushed or opened.
#
# The bump commit is not run through the tests again: it is main plus
# the version, which scripts/check-version-bump.sh proves, so it is the
# code that was just verified. (Running everything twice doubled a
# release to ~5 minutes for no new information.) Problems are meant to
# be caught before merge, in pr-checks.yml; the main run here is a
# last check before something goes live on the store.
#
# Pushes made with GITHUB_TOKEN never trigger pr-checks.yml, and the PR
# it opens gets its pull_request run only in an approval-required
# state (GitHub anti-loop rule: "events triggered by the GITHUB_TOKEN
# will not create a new workflow run", except workflow_dispatch and
# repository_dispatch). This job therefore posts the `verify` check
# run the main ruleset requires itself, once it has verified main and
# checked the bump commit. No PAT or GitHub App needed.
#
# No long-lived secrets: GITHUB_TOKEN handles the branch push, PR
# creation, the check run and auto-merge queueing; npm publish uses
# OIDC trusted publishing. The npm trusted-publisher entry for
# @thefittingroom/shop-ui must point at this file (release.yaml).
#
# To release:
#   Actions tab → Release → Run workflow → pick patch/minor/major → Run.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  # Required for OIDC trusted publishing — lets the runner mint a
  # short-lived token npm exchanges for publish rights.
  id-token: write
  # Required to push the release-bump branch + tag.
  contents: write
  # Required to open the auto-merge PR against main.
  pull-requests: write
  # Required to post the `verify` check run on the bump SHA.
  checks: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Routes scoped publishes to the right registry resolver.
          scope: "@thefittingroom"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Same verification as pr-checks.yml's verify job, on main's SHA.
      # The bump commit below differs only in its version, which is
      # checked rather than re-verified.
      - name: Type-check + lint + format-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        id: e2e_main
        run: npm run test:e2e

      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # Create a fresh branch for the bump. We push the bump there (not
      # to main) so the main-branch ruleset's pull_request requirement
      # isn't violated by a direct push. The PR-based merge path
      # requires this indirection.
      - name: Create release-bump branch
        id: bump_branch
        run: |
          BUMP_BRANCH="release-bump-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BUMP_BRANCH"
          echo "name=$BUMP_BRANCH" >> "$GITHUB_OUTPUT"

      # Bumps package.json + package-lock.json, creates a bump commit,
      # and creates a vX.Y.Z tag locally on that commit. Nothing leaves
      # the runner until the bump commit has been checked and
      # been published.
      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.version_bump }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The bump commit must be main plus the version and nothing else:
      # that is what makes it the code verified above.
      - name: Check the bump commit changes only the version
        run: scripts/check-version-bump.sh

      # Rebuild so the version embedded in dist/ (vite config defines
      # BUILD_VERSION from packageJson.version) is the one we publish,
      # and check it is there.
      - name: Build (bump commit)
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          npm run build
          grep -qF "\"${NEW_VERSION}\"" dist/index.js || {
            echo "::error::dist/index.js does not contain version ${NEW_VERSION}"
            exit 1
          }

      - name: Upload Playwright report
        if: failure() && steps.e2e_main.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # OIDC trusted publishing, no NPM_TOKEN. --provenance attaches a
      # supply-chain attestation tying this tarball to this workflow run
      # and the main commit it started from (github.sha); the tarball is
      # built from the bump commit, which is that commit plus the
      # version change. Publishing is the irreversible step, so it comes
      # right after the bump commit has been checked and before
      # anything is pushed; README "Release process" covers recovery
      # when a later step fails.
      - name: Publish to npm (next)
        run: npm publish --tag next --provenance --verbose

      # Tag stays on the bump commit even after the branch is squash-
      # merged + deleted — tag refs are independent of branch refs. `git
      # log v5.0.39` continues to work; the tag just doesn't reach main
      # by parent traversal.
      - name: Push bump branch + tag
        run: git push origin "${{ steps.bump_branch.outputs.name }}" --follow-tags

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_BRANCH: ${{ steps.bump_branch.outputs.name }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr create \
            --base main \
            --head "$BUMP_BRANCH" \
            --title "chore: release v${NEW_VERSION}" \
            --body "$(cat <<EOF
          Automated release-bump PR opened by \`release.yaml\`.

          - Bump: \`${{ inputs.version_bump }}\` → \`v${NEW_VERSION}\`
          - Published to npm as \`v${NEW_VERSION}\` under dist-tag \`next\`
          - Tag \`v${NEW_VERSION}\` already pushed to the bump commit

          \`release.yaml\` ran \`npm run check\`, \`npm run build\` and the Playwright suite on \`main\`, confirmed this bump commit changes only the version, and rebuilt it before publishing. The \`verify\` check on this PR is posted by that run (${RUN_URL}); auto-merge fires once GitHub records it.
          EOF
          )"

      # The main ruleset requires a passing `verify` context on the head
      # SHA. Post it from here: this job verified main and confirmed the
      # bump commit is main plus the version, and the check links back to
      # this run.
      # pr-checks.yml's own run for the PR exists only in an
      # approval-required state and is redundant with this check.
      - name: Post verify check run on the bump SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_SHA: ${{ steps.bump.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=verify \
            -f head_sha="$BUMP_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f details_url="$RUN_URL" \
            -f "output[title]=verify" \
            -f "output[summary]=npm run check, npm run build and the Playwright suite passed on main, and ${BUMP_SHA} changes only the version (scripts/check-version-bump.sh), in release.yaml run ${RUN_URL}"

      # GitHub finishes the squash-merge once the check above is
      # recorded; gh merges immediately if the PR is already mergeable.
      # This workflow exits before the merge; check the PR for the merge
      # event.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_BRANCH: ${{ steps.bump_branch.outputs.name }}
        run: gh pr merge "$BUMP_BRANCH" --squash --auto --delete-branch
