name: Release

# Human-initiated release. Triggered manually from the Actions tab when
# you're ready to ship a new version. Replaces the previous label-driven
# auto-publish-on-PR-merge flow (which had a fragile multi-stage chain
# tied to PATs, `pull_request_target` quirks, and OIDC trigger
# restrictions).
#
# Flow: verify main (the same check + build + e2e steps as the verify
# job in pr-checks.yml) → bump on a fresh release-bump-<ts> branch →
# publish to npm via OIDC trusted publishing → open PR to main → enable
# auto-merge. Any verification failure stops the run before the bump,
# so nothing is tagged, pushed or published from a broken main. Pushing
# the bump branch triggers pr-checks.yml, which runs verify again on
# the bump SHA; auto-merge fires once that check-run passes.
#
# No long-lived secrets: GITHUB_TOKEN handles the branch push, PR
# creation, and auto-merge queueing; npm publish uses OIDC trusted
# publishing. The npm trusted-publisher entry for @thefittingroom/shop-ui
# must point at this file (release.yaml).
#
# To release:
#   Actions tab → Release → Run workflow → pick patch/minor/major → Run.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  # Required for OIDC trusted publishing — lets the runner mint a
  # short-lived token npm exchanges for publish rights.
  id-token: write
  # Required to push the release-bump branch + tag.
  contents: write
  # Required to open the auto-merge PR against main.
  pull-requests: write
  # Required to approve the downstream pr-checks workflow run that
  # GitHub gates with `action_required` when a bot opens the PR.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Routes scoped publishes to the right registry resolver.
          scope: "@thefittingroom"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Same verification as pr-checks.yml's verify job, run on main's
      # SHA before anything is bumped, tagged, pushed or published. A
      # failure here ends the run with nothing to clean up.
      - name: Type-check + lint + format-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # Create a fresh branch for the bump. We push the bump here (not
      # to main) so the main-branch ruleset's pull_request requirement
      # isn't violated by a direct push. The PR-based merge path
      # requires this indirection.
      - name: Create release-bump branch
        id: bump_branch
        run: |
          BUMP_BRANCH="release-bump-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BUMP_BRANCH"
          echo "name=$BUMP_BRANCH" >> "$GITHUB_OUTPUT"

      # Bumps package.json + package-lock.json, creates a bump commit,
      # and creates a vX.Y.Z tag locally on that commit.
      - name: Bump version
        run: npm version "${{ inputs.version_bump }}"

      # Rebuild after the bump so the version embedded in dist/ matches
      # what we're about to publish (vite config picks up
      # packageJson.version at build time).
      - name: Build (post-bump)
        run: npm run build

      # Push the bump branch + the vX.Y.Z tag. Pushing the branch
      # triggers pr-checks.yml on `push`, which runs the verify job on
      # the bump SHA and posts the `verify` check-run main's ruleset
      # requires. Auto-merge below waits for it.
      #
      # Tag stays on the bump commit even after the branch is squash-
      # merged + deleted — tag refs are independent of branch refs. `git
      # log v5.0.39` continues to work; the tag just doesn't reach main
      # by parent traversal.
      - name: Push bump branch + tag
        run: git push origin "${{ steps.bump_branch.outputs.name }}" --follow-tags

      # OIDC trusted publishing — no NPM_TOKEN. --provenance attaches a
      # supply-chain attestation tying this tarball to this workflow run
      # and the main commit it started from (github.sha), which is the
      # commit the verification above ran on. The bump commit is that
      # commit plus the version change.
      - name: Publish to npm (next)
        run: npm publish --tag next --provenance --verbose

      # Open the PR + queue auto-merge. GitHub finishes the squash-merge
      # once pr-checks.yml's `verify` check-run on the bump SHA passes.
      # This workflow exits before that; check the PR for the merge
      # event. If verify fails on the bump SHA the PR stays open while
      # the version is already on npm under `next`; see README "Release
      # process" for what to do.
      - name: Open + auto-merge release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_BRANCH: ${{ steps.bump_branch.outputs.name }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          gh pr create \
            --base main \
            --head "$BUMP_BRANCH" \
            --title "chore: release v${NEW_VERSION}" \
            --body "$(cat <<EOF
          Automated release-bump PR opened by \`release.yaml\`.

          - Bump: \`${{ inputs.version_bump }}\` → \`v${NEW_VERSION}\`
          - Published to npm as \`v${NEW_VERSION}\` under dist-tag \`next\`
          - Tag \`v${NEW_VERSION}\` already pushed to the bump commit

          \`release.yaml\` ran \`npm run check\`, \`npm run build\` and the Playwright suite on \`main\` before bumping. The \`verify\` required check runs the same steps again on the bump SHA via \`pr-checks.yml\`; auto-merge fires when it passes.
          EOF
          )"
          gh pr merge "$BUMP_BRANCH" --squash --auto --delete-branch

      # Approve the pr-checks run that the `pull_request` event for the
      # PR above created. Any `pull_request` event on a PR opened by
      # GITHUB_TOKEN gets `action_required` (GitHub's anti-loop guard
      # for bot-triggered workflows, not configurable at the repo
      # level). Left unapproved, that run sits on the PR waiting for a
      # human; approving it lets it execute the verify job on the bump
      # SHA like the push-triggered run does, and auto-merge fires once
      # the `verify` check passes.
      #
      # Approving a workflow run is separate from the anti-loop rule
      # and IS allowed for GITHUB_TOKEN with `actions: write`.
      #
      # Poll for up to ~60s in case the pull_request event hasn't
      # created the run yet (typically appears within 1–2s).
      - name: Auto-approve the pr-checks run for the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_BRANCH: ${{ steps.bump_branch.outputs.name }}
        run: |
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow=pr-checks.yml \
              --branch="$BUMP_BRANCH" \
              --limit=1 \
              --json databaseId,conclusion,status \
              --jq '.[] | select(.conclusion == "action_required") | .databaseId')
            if [ -n "$RUN_ID" ]; then
              echo "Approving pr-checks run $RUN_ID"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve" --method POST
              exit 0
            fi
            echo "Attempt $attempt: no action_required pr-checks run yet, waiting…"
            sleep 2
          done
          echo "::warning::No action_required pr-checks run appeared within timeout. PR will need manual approval." >&2
          exit 0
