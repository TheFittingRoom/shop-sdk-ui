name: PR Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # release.yaml pushes a release-bump-<timestamp> branch, then opens a
  # PR via GITHUB_TOKEN. The `pull_request` run for a PR opened by
  # GITHUB_TOKEN sits in `action_required` until someone approves it
  # (GitHub anti-loop rule), so it cannot be relied on to post the
  # `verify` required-check. Trigger on branch push as well: that run
  # executes the full job against the bump SHA and posts a real
  # `verify` check-run, which the PR's required-check picks up when
  # it's opened moments later.
  push:
    branches:
      - 'release-bump-*'

jobs:
  verify:
    # Job name intentionally short — this is the required-status-check
    # context that shows next to the merge button on every PR. Renaming
    # here means updating the repository ruleset's
    # required_status_checks contexts too (Settings → Rules → main).
    #
    # Do not add a job-level `if:` here. A skipped job still posts a
    # check-run, and GitHub counts `skipped` as success for
    # required-status-checks, so any branch-name exemption lets an
    # unverified commit merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull_request: check out the PR head (not the synthetic
          # merge commit) so lint/tsc/tests run against exactly what
          # the branch contains.
          # For push: default checkout of github.sha is correct.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check + lint + format-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
